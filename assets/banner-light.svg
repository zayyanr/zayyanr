    <circle cx="73" cy="66" r="2" fill="#FFBF95"/>
    <text x="98" y="63" fill="#4D5B72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DEVELOPER / BUILDER</text>
