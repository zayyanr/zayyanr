      <stop stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#F8F9FC"/>
    </linearGradient>
    <clipPath id="round"><rect x=".5" y=".5" width="1023" height="319" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
